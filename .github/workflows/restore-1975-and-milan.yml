name: Restore original 1975 GIF and Milan cover
on:
  push:
    paths:
      - '.github/staging/1975/**'
      - '.github/workflows/restore-1975-and-milan.yml'
permissions:
  contents: write
jobs:
  import-original-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the exact 90-frame GIF and original Milan image
        env:
          MILAN_URL: "https://pikaso.cdnpk.net/private/production/6041114776/3870569000.png?token=exp=1794960000~hmac=54bda00f6eab4da5adfecdf5208812c7d04590fa73e84a4ca18fa2af4183d8f6"
        run: |
          cat .github/staging/1975/part-* > assets/the-1975-original.gif
          printf '%s  %s\n' 'f4a5fd11929326d408bc23de147bfeb03902742c6b02079ca952ceaff154c094' 'assets/the-1975-original.gif' | sha256sum -c -
          file --mime-type assets/the-1975-original.gif | grep -q 'image/gif'
          curl --fail --location --retry 3 --retry-delay 2 -o assets/milan-fashion-week-original.png "$MILAN_URL"
          printf '%s  %s\n' '1d88a1f598ca59a3cd87192d95adfa3ba3ab7f1e315ba0bef09b79501eb10b0a' 'assets/milan-fashion-week-original.png' | sha256sum -c -
          file --mime-type assets/milan-fashion-week-original.png | grep -q 'image/png'
      - name: Commit originals and remove temporary staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/the-1975-original.gif assets/milan-fashion-week-original.png
          git rm -r .github/staging/1975 .github/workflows/restore-1975-and-milan.yml
          git commit -m 'Restore exact user-supplied animated GIF and Milan cover'
          git push origin HEAD:main
