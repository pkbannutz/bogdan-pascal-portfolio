name: Import supplied 13 Shades cover
on:
  push:
    paths:
      - .github/workflows/import-13-shades-cover.yml
permissions:
  contents: write
jobs:
  import-cover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import original user-supplied 16 by 9 cover
        env:
          IMAGE_URL: "https://pikaso.cdnpk.net/private/production/6040996935/3870512696.png?token=exp=1794960000~hmac=d1ccfbc4d1c0268904e3b1eaf2a8d7ab30347d84f4a9e24395c83b86d4d7a346"
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --output assets/13-shades-of-romanian-cover.png "$IMAGE_URL"
          test "$(wc -c < assets/13-shades-of-romanian-cover.png)" -gt 100000
          file --mime-type assets/13-shades-of-romanian-cover.png | grep -q 'image/png'
      - name: Commit cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/13-shades-of-romanian-cover.png
          if ! git diff --cached --quiet; then
            git commit -m "Add supplied 13 Shades of Romanian 16x9 cover"
            git push origin HEAD:main
          fi
