name: Import supplied RGT photograph
on:
  push:
    paths:
      - .github/workflows/import-rgt-photo.yml
permissions:
  contents: write
jobs:
  import-photo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve user-supplied photo
        env:
          PHOTO_URL: "https://pikaso.cdnpk.net/private/production/6040348877/3870206838.png?token=exp=1794960000~hmac=8e317c402844a4c4e715822209bf9f0992738247c5732c3dbf745367ad750e4d"
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --output assets/romanias-got-talent-group.png "$PHOTO_URL"
          test "$(wc -c < assets/romanias-got-talent-group.png)" -gt 100000
      - name: Add original photo to portfolio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/romanias-got-talent-group.png
          if ! git diff --cached --quiet; then
            git commit -m "Add supplied Romania's Got Talent group photograph"
            git push origin HEAD:main
          fi
