name: Import transparent RGT cutout
on:
  push:
    paths:
      - .github/workflows/import-rgt-cutout.yml
permissions:
  contents: write
jobs:
  import-cutout:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download user-supplied transparent PNG
        env:
          IMAGE_URL: "https://pikaso.cdnpk.net/private/production/6040676435/3870361556.png?token=exp=1794960000~hmac=f50ce9e5ac4e48a3ef1833dd32feb806680211accbeb0090edb8eb3a93ea099e"
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --output assets/romanias-got-talent-cutout.png "$IMAGE_URL"
          test "$(wc -c < assets/romanias-got-talent-cutout.png)" -gt 100000
          file --mime-type assets/romanias-got-talent-cutout.png | grep -q 'image/png'
      - name: Commit original cutout into portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/romanias-got-talent-cutout.png
          if ! git diff --cached --quiet; then
            git commit -m "Add transparent RGT group cutout from supplied photograph"
            git push origin HEAD:main
          fi
