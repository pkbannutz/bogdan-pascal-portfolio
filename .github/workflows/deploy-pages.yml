name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Check site text contains no em dashes
        run: |
          python3 -c 'from pathlib import Path; files = [Path("index.html")] + [p for p in Path("assets").rglob("*") if p.suffix.lower() in {".svg", ".html", ".css", ".js"}]; banned = (chr(0x2014), "&mdash;", "&#8212;", "&#x2014;"); violations = [str(p) for p in files if any(t in p.read_text(encoding="utf-8").lower() for t in banned)]; assert not violations, "Website text must not contain em dashes: " + ", ".join(violations)'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare publish folder
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d assets ]; then cp -R assets _site/assets; fi
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
