name: Import redesigned RGT white-background card artwork
on:
  push:
    paths:
      - .github/workflows/import-rgt-layout.yml
permissions:
  contents: write
jobs:
  import-card:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the prepared 16-by-9 user photo layout
        env:
          IMAGE_URL: "https://pikaso.cdnpk.net/private/production/6040405288/3870232897.jpg?token=exp=1794960000~hmac=4ed0519e4aa03053118bad4994032bf6c017ec4d9da3fcd261c530843a724489"
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --output assets/romanias-got-talent-layout.jpg "$IMAGE_URL"
          test "$(wc -c < assets/romanias-got-talent-layout.jpg)" -gt 100000
          file --mime-type assets/romanias-got-talent-layout.jpg | grep -q 'image/jpeg'
      - name: Add portfolio artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/romanias-got-talent-layout.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add white 16:9 Romania's Got Talent artwork with group shifted right"
            git push origin HEAD:main
          fi
