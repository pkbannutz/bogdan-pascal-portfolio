<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Bogdan Pascal | Athlete and Filmmaker</title>
<meta name="description" content="Bogdan Pascal. Parkour coordinator, stunt performer and movement director. Director of photography, drone operator and colourist.">
<meta property="og:title" content="Bogdan Pascal | Athlete and Filmmaker">
<meta property="og:description" content="Choose a side: the athlete or the filmmaker.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://bogdanpascal.com/assets/hero.jpg">
<link rel="icon" type="image/svg+xml" href="/assets/symbol-light.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--lime:#d7ff3a}
html,body{height:100%;background:#050505;color:#fff;font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none}
.mono{font-family:'Space Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.brand{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:50;pointer-events:none}
.brand img{display:block;height:clamp(22px,2.4vw,30px);width:auto}
.wrap{display:flex;flex-direction:column;height:100%;height:100dvh}
.p{position:relative;flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(48px,7vh,72px) 5vw clamp(18px,3.4vh,34px);transition:flex .8s cubic-bezier(.2,.8,.2,1);border-bottom:1px solid #000}
.p:last-child{border-bottom:0}
.p:hover,.p:focus-visible{flex:1.7}
.bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:brightness(.42);transition:filter .6s,transform 1.4s}
.p:hover .bg,.p:focus-visible .bg{filter:brightness(.8);transform:scale(1.04)}
.p>*:not(.bg){position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-start;opacity:.85}
h2{font-size:clamp(46px,12.5vw,230px);font-weight:700;letter-spacing:-.055em;line-height:.84;white-space:nowrap}
.f h2 em{font-style:italic;color:var(--lime)}
.bot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.cr{line-height:1.9;font-size:12px;letter-spacing:.18em;min-width:0}
@media(min-width:1100px){.cr{white-space:nowrap}}
.ww{position:fixed;right:5vw;top:50%;transform:translateY(-50%);z-index:40;pointer-events:none;display:grid;font:700 11px 'Space Mono',ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.ww span{grid-area:1/1;color:#fff;text-shadow:0 0 14px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.55)}
.ww .lo{color:var(--lime);clip-path:inset(0 0 100% 0)}
@media(max-width:720px){
 .ww{right:22px}
 .p{padding:56px 22px 20px}
 h2{font-size:17vw}
 .bot{gap:14px}
 .cr{font-size:10px;letter-spacing:.14em;}
 .p:hover,.p:focus-visible{flex:1}
}
@media(prefers-reduced-motion:reduce){.p,.bg{transition:none}}
</style>
</head>
<body>
<div class="brand"><img src="/assets/logo-dark.svg" alt="Bogdan Pascal"></div>
<div class="ww" id="ww" aria-label="Available worldwide"><span class="hi" aria-hidden="true">Available worldwide</span><span class="lo" aria-hidden="true">Available worldwide</span></div>
<main class="wrap">
  <a class="p a" href="/athlete/" aria-label="Enter the athlete site">
    <div class="bg" style="background-image:url(/assets/hero.jpg)"></div>
    <div class="top mono"><span>01 / Movement</span></div>
    <h2>Athlete</h2>
    <div class="bot">
      <div class="cr mono">Parkour Coordinator &middot; Stunt Performer &middot; Movement Director</div>
    </div>
  </a>
  <a class="p f" href="/filmmaker/" aria-label="Enter the filmmaker site">
    <div class="bg" style="background-image:url(/assets/filmmaker/geodome/t.jpg)"></div>
    <div class="top mono"><span>02 / Cinema</span></div>
    <h2><em>Filmmaker</em></h2>
    <div class="bot">
      <div class="cr mono">Director of Photography &middot; Drone Operator &middot; Colourist</div>
    </div>
  </a>
</main>
<script>
(function(){var w=document.getElementById('ww'),hi=w.querySelector('.hi'),lo=w.querySelector('.lo'),top=document.querySelector('.p');
function upd(){var r=w.getBoundingClientRect(),y=top.getBoundingClientRect().bottom-r.top;y=Math.max(0,Math.min(r.height,y));
hi.style.clipPath='inset(0 0 '+(r.height-y)+'px 0)';lo.style.clipPath='inset('+y+'px 0 0 0)'}
var raf;function run(t0){cancelAnimationFrame(raf);var end=performance.now()+1100;(function f(){upd();if(performance.now()<end)raf=requestAnimationFrame(f)})()}
document.querySelectorAll('.p').forEach(function(p){['mouseenter','mouseleave','focus','blur'].forEach(function(e){p.addEventListener(e,run)})});
addEventListener('resize',upd);addEventListener('load',upd);upd();})();
</script>
</body>
</html>
